<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>健身組間休息計時器 | Rest Timer</title>
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rest Timer">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 頂部資訊列 -->
    <header class="header">
      <div class="app-title">
        <span class="icon">⏱</span>
        <span>REST TIMER</span>
      </div>
      <div class="header-actions">
        <button id="wakeLockBtn" class="icon-btn" title="保持螢幕常亮" aria-label="保持螢幕常亮">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
        </button>
        <button id="soundToggleBtn" class="icon-btn" title="切換音效" aria-label="切換音效">
          <svg id="soundOnIcon" class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="soundOffIcon" class="icon-svg hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- 中央計時環 -->
    <main class="timer-section">
      <div class="progress-ring-container">
        <svg class="progress-ring" viewBox="0 0 320 320">
          <circle class="ring-bg" cx="160" cy="160" r="140" />
          <circle id="progressCircle" class="ring-indicator" cx="160" cy="160" r="140" />
        </svg>

        <div class="timer-display">
          <div id="statusLabel" class="status-label">READY</div>
          <div id="timeText" class="time-text">01:00</div>
          <div id="setInfo" class="set-counter">組數: <span id="setCount">0</span></div>
        </div>
      </div>

      <!-- 微調時間按鈕 (+/- 15s) -->
      <div class="adjust-group">
        <button id="btnMinus15" class="adjust-btn" title="減少 15 秒">-15s</button>
        <button id="btnPlus15" class="adjust-btn" title="增加 15 秒">+15s</button>
      </div>
    </main>

    <!-- 快速設定區塊 (30s, 60s, 90s) -->
    <section class="preset-section">
      <div class="section-label">快速設定</div>
      <div class="preset-grid">
        <button class="preset-btn" data-time="30">
          <span class="preset-number">30</span>
          <span class="preset-unit">SEC</span>
        </button>
        <button class="preset-btn active" data-time="60">
          <span class="preset-number">60</span>
          <span class="preset-unit">SEC</span>
        </button>
        <button class="preset-btn" data-time="90">
          <span class="preset-number">90</span>
          <span class="preset-unit">SEC</span>
        </button>
      </div>
    </section>

    <!-- 控制按鈕區 (開始、暫停、重置) -->
    <footer class="controls-section">
      <button id="resetBtn" class="control-btn secondary" title="重置計時器">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>重置</span>
      </button>

      <button id="startPauseBtn" class="control-btn primary">
        <svg id="playIcon" class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <svg id="pauseIcon" class="btn-icon hidden" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
        <span id="startPauseText">開始</span>
      </button>

      <button id="nextSetBtn" class="control-btn secondary" title="完成一組並重設計時">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span>下一組</span>
      </button>
    </footer>

    <!-- 今日訓練清單區塊 -->
    <section class="workout-section">
      <div class="workout-header">
        <div class="workout-title">
          <span class="icon">📋</span>
          <span>今日訓練清單</span>
          <span id="workoutProgressBadge" class="progress-badge">0/0 完成</span>
        </div>
        <button id="clearCompletedBtn" class="text-action-btn" title="清除已打勾的動作">清除已完成</button>
      </div>

      <!-- 新增動作表單 -->
      <form id="workoutForm" class="workout-form">
        <div class="form-inputs">
          <input type="text" id="exerciseName" class="workout-input name-input" placeholder="動作名稱 (例：槓鈴深蹲、臥推)" required autocomplete="off">
          <div class="input-row">
            <input type="text" id="exerciseWeight" class="workout-input" placeholder="重量 (例：80 kg)" autocomplete="off">
            <input type="text" id="exerciseSets" class="workout-input" placeholder="組數/次數 (例：4組 8次)" autocomplete="off">
          </div>
        </div>
        <button type="submit" class="add-exercise-btn">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>新增動作</span>
        </button>
      </form>

      <!-- 訓練項目清單 -->
      <ul id="workoutList" class="workout-list"></ul>

      <div id="workoutEmptyState" class="empty-state">
        <span>今日尚未加入訓練動作，填寫上方表單開始記錄！</span>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
